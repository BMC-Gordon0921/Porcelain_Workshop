<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1920" height="1080" fill="#F5F1E7"/><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="88" y="56.78">TERRA / 景德镇瓷器之旅</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" text-anchor="end"><tspan x="1832" y="56.78">01 / DESIGN GOAL</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="70" font-weight="700" text-anchor="start"><tspan x="88" y="178.3">让文化从观看，变成动手</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="92" y="241.68">设计出发点：降低进入门槛，让操作、反馈与文化主题产生联系。</tspan></text><line x1="88" y1="1018" x2="1832" y2="1018" stroke="#D5DCD8" stroke-width="1" /><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="88" y="1054.79">课程作品展示 · 2026.10</tspan></text><text fill="#285487" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" text-anchor="end"><tspan x="1830" y="1054.76">02</tspan></text><rect x="88" y="316" width="554" height="586" rx="22" fill="#FFFDF7" /><ellipse cx="178" cy="408" rx="58" ry="58" fill="#285487" /><text fill="#FFFFFF" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="75" font-weight="700" text-anchor="middle"><tspan x="178" y="433.25">看</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="49" font-weight="700" text-anchor="start"><tspan x="121" y="563.51">先产生兴趣</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="37" font-weight="400" text-anchor="start"><tspan x="123" y="652.63">地点故事和 3D 成品</tspan><tspan x="123" y="702.21">帮助玩家知道：</tspan><tspan x="123" y="751.79">我将做出什么。</tspan></text><rect x="683" y="316" width="554" height="586" rx="22" fill="#FFFDF7" /><ellipse cx="773" cy="408" rx="58" ry="58" fill="#BB6842" /><text fill="#FFFFFF" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="75" font-weight="700" text-anchor="middle"><tspan x="773" y="433.25">做</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="49" font-weight="700" text-anchor="start"><tspan x="716" y="563.51">获得可理解的反馈</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="37" font-weight="400" text-anchor="start"><tspan x="718" y="652.63">推拉、绘画、火候判定</tspan><tspan x="718" y="702.21">把制作过程变成</tspan><tspan x="718" y="751.79">玩家自己的动作。</tspan></text><rect x="1278" y="316" width="554" height="586" rx="22" fill="#FFFDF7" /><ellipse cx="1368" cy="408" rx="58" ry="58" fill="#7C9483" /><text fill="#FFFFFF" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="44" font-weight="700" text-anchor="middle"><tspan x="1368" y="422.56">带走</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="49" font-weight="700" text-anchor="start"><tspan x="1311" y="563.51">留下可见的完成感</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="37" font-weight="400" text-anchor="start"><tspan x="1313" y="652.63">每站收集一件场景成品</tspan><tspan x="1313" y="702.21">让一次短体验</tspan><tspan x="1313" y="751.79">形成完整的旅程。</tspan></text></svg>