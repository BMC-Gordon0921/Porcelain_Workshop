<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1920" height="1080" fill="#F5F1E7"/><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="88" y="56.78">TERRA / 景德镇瓷器之旅</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" text-anchor="end"><tspan x="1832" y="56.78">12 / REFLECTION</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="70" font-weight="700" text-anchor="start"><tspan x="88" y="178.3">完成可玩的闭环，继续验证体验</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="92" y="241.68">当前成果与后续计划分开呈现，避免把设想当作已经完成。</tspan></text><line x1="88" y1="1018" x2="1832" y2="1018" stroke="#D5DCD8" stroke-width="1" /><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="88" y="1054.79">课程作品展示 · 2026.10</tspan></text><text fill="#285487" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" text-anchor="end"><tspan x="1830" y="1054.76">13</tspan></text><rect x="88" y="336" width="548" height="521" rx="18" fill="#FFFDF7" /><rect x="88" y="336" width="6" height="521" rx="0" fill="#285487" /><text fill="#285487" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="118" y="388.75">当前边界</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" text-anchor="start"><tspan x="118" y="465.57">正面编辑，非体积拉坯</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="118" y="534.68">用 112 × 112 正面数据</tspan><tspan x="118" y="577.56">记录形状与颜色，</tspan><tspan x="118" y="620.4399999999999">通过渲染与成品预览</tspan><tspan x="118" y="663.3199999999999">表现立体感。</tspan></text><rect x="686" y="336" width="548" height="521" rx="18" fill="#FFFDF7" /><rect x="686" y="336" width="6" height="521" rx="0" fill="#7C9483" /><text fill="#7C9483" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="716" y="388.75">内容边界</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" text-anchor="start"><tspan x="716" y="465.57">四站共享五类订单</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="716" y="534.68">场景、建筑和纹样有变化，但任务</tspan><tspan x="716" y="577.56">结构复用。后续可增加器型与文化</tspan><tspan x="716" y="620.4399999999999">讲解的关联。</tspan></text><rect x="1284" y="336" width="548" height="521" rx="18" fill="#FFFDF7" /><rect x="1284" y="336" width="6" height="521" rx="0" fill="#BB6842" /><text fill="#BB6842" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="1314" y="388.75">下一步计划</tspan></text><text fill="#243E50" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" text-anchor="start"><tspan x="1314" y="465.57">用新手测试寻找改进点</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" text-anchor="start"><tspan x="1314" y="534.68">重点观察边缘抓取、烧窑时机和地</tspan><tspan x="1314" y="577.56">图理解；再迭代引导、工具手感与</tspan><tspan x="1314" y="620.4399999999999">内容层次。</tspan></text><text fill="#65767B" font-family="Microsoft YaHei,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" text-anchor="start"><tspan x="94" y="957.69">拟观察：首次成功操作 / 首次通关过程 / 火候规则理解。尚未开展正式用户研究。</tspan></text></svg>