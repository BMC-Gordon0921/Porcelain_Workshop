<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terra · 游戏原型图集</title><style>*{box-sizing:border-box}body{margin:0;background:#F5F1E7;font-family:'Microsoft YaHei',sans-serif;color:#243E50;display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{padding:26px 18px;background:#FFFDF7;border-right:1px solid #D5DCD8}h1{font-size:22px;margin:0 0 22px}button{font:inherit;cursor:pointer;border:0;text-align:left;padding:13px 12px;width:100%;border-radius:9px;margin:3px 0;background:transparent;color:inherit}button.active{background:#E2EBF2;color:#285487;font-weight:bold}main{display:flex;flex-direction:column;justify-content:center;padding:22px;min-width:0}img{width:100%;height:auto;box-shadow:0 14px 45px #243e5014;border-radius:10px}.nav{display:flex;justify-content:space-between;gap:16px;margin-top:20px}.nav button{width:auto;background:#FFFDF7;text-align:center}p{font-size:14px;line-height:1.8;color:#65767B}@media(max-width:760px){body{grid-template-columns:1fr}aside{padding:14px;display:flex;flex-wrap:wrap;gap:4px}aside h1{width:100%}aside button{width:auto;font-size:12px;padding:8px}main{padding:10px}}</style><aside><h1>Terra · 游戏原型</h1><div id="menu"></div><p>页面线框与当前界面对照<br>键盘 ← / → 切换页面</p></aside><main><img id="board" alt="游戏原型图"><div class="nav"><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></div></main><script>const pages=[{"name":"00_交互流程总览","src":"原型图/00_交互流程总览.svg"},{"name":"01_主页","src":"原型图/01_主页.svg"},{"name":"02_地图","src":"原型图/02_地图.svg"},{"name":"03_工坊","src":"原型图/03_工坊.svg"},{"name":"04_塑形","src":"原型图/04_塑形.svg"},{"name":"05_上色","src":"原型图/05_上色.svg"},{"name":"06_烧窑","src":"原型图/06_烧窑.svg"},{"name":"07_结算","src":"原型图/07_结算.svg"},{"name":"08_贴花收藏","src":"原型图/08_贴花收藏.svg"},{"name":"09_移动端","src":"原型图/09_移动端.svg"}];let index=0;const menu=document.getElementById('menu');pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.name.replace('_',' · ');b.onclick=()=>show(i);menu.append(b)});function show(i){index=(i+pages.length)%pages.length;document.getElementById('board').src=pages[index].src;document.getElementById('counter').textContent=(index+1)+' / '+pages.length;[...menu.children].forEach((b,i)=>b.classList.toggle('active',i===index))}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.onkeydown=e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)};show(0);</script></html>
